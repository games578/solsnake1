<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake SOL</title>
<style>
  :root { --bg:#14161f; --panel:#1d2030; --line:#2c3047; --ink:#e8e9f1; --mute:#8b90a8; --me:#3ddbc0; --them:#ff7a59; --food:#f5d547; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; min-height:100vh; }
  h1 { margin:8px 0 2px; font-size:28px; letter-spacing:-.5px; }
  .sub { color:var(--mute); margin:0 0 16px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; margin-bottom:12px; }
  button { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px 16px; font:inherit; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--me); }
  button:focus-visible { outline:2px solid var(--me); outline-offset:2px; }
  button:disabled { opacity:.45; cursor:default; }
  button.on { border-color:var(--me); color:var(--me); }
  button.go { background:var(--me); color:#06201b; border-color:var(--me); font-weight:600; }
  #status { min-height:28px; margin:8px 0; text-align:center; }
  canvas { background:var(--panel); border:1px solid var(--line); border-radius:8px; max-width:100%; touch-action:none; }
  .legend { color:var(--mute); font-size:14px; margin-top:8px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin:0 4px 0 12px; }
  .note { color:var(--mute); font-size:13px; max-width:480px; text-align:center; margin-top:16px; }
</style>
</head>
<body>
<h1>Snake SOL</h1>
<p class="sub">1v1 snake. Winner takes the pot.</p>

<div class="bar">
  <button id="connect">Connect Phantom</button>
  <span id="stakes"></span>
  <button id="play" class="go" disabled>Stake and play</button>
  <button id="leave" hidden>Cancel and refund</button>
</div>
<div id="status">Connect your wallet to start.</div>
<canvas id="c" width="480" height="480"></canvas>
<div class="legend"><span class="dot" style="background:var(--me)"></span>You<span class="dot" style="background:var(--them)"></span>Opponent<span class="dot" style="background:var(--food)"></span>Food</div>
<p class="note" id="note">Devnet test mode. Steer with arrow keys, WASD or swipe.</p>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.98.0/lib/index.iife.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const cvs = $('c'), ctx = cvs.getContext('2d');
let ws, cfg, provider, wallet, stake = 0.01, you = -1, grid = 30, state = null, playing = false;

const status = (t) => { $('status').textContent = t; };

function connectWS() {
  const base = window.SERVER_URL || ((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws = new WebSocket(base);
  ws.onmessage = (e) => handle(JSON.parse(e.data));
  ws.onclose = () => status('Disconnected. Refresh to reconnect.');
}

function handle(m) {
  if (m.type === 'config') {
    cfg = m;
    $('stakes').innerHTML = '';
    m.stakes.forEach((s) => {
      const b = document.createElement('button');
      b.textContent = s + ' SOL';
      b.className = s === stake ? 'on' : '';
      b.onclick = () => { stake = s; [...$('stakes').children].forEach((x) => x.classList.remove('on')); b.classList.add('on'); };
      $('stakes').appendChild(b);
    });
    $('note').textContent = `${m.cluster} test mode. House fee ${m.rakeBps / 100}% of the pot. Steer with arrow keys, WASD or swipe.`;
  } else if (m.type === 'queued') {
    status('Stake locked. Waiting for an opponent at this stake...');
    $('leave').hidden = false;
  } else if (m.type === 'left') {
    status('Stake refunded.'); $('leave').hidden = true; $('play').disabled = !wallet;
  } else if (m.type === 'start') {
    you = m.you; grid = m.grid; playing = true; $('leave').hidden = true;
    let n = Math.ceil(m.countdown / 1000);
    status(`Match found. Starting in ${n}...`);
    const t = setInterval(() => { n--; if (n <= 0) { clearInterval(t); status('Go!'); } else status(`Starting in ${n}...`); }, 1000);
  } else if (m.type === 'state') {
    state = m; draw();
  } else if (m.type === 'end') {
    playing = false; $('play').disabled = false;
    const why = m.why === 'forfeit' ? ' (opponent left)' : '';
    if (m.result === 'win') status(`You won ${m.payout.toFixed(4)} SOL${why}.`);
    else if (m.result === 'lose') status('You lost this one.');
    else status(`Draw. Your ${m.payout} SOL stake was refunded.`);
  } else if (m.type === 'error') {
    status(m.msg); $('play').disabled = !wallet;
  }
}

function draw() {
  const cell = cvs.width / grid;
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  const css = getComputedStyle(document.documentElement);
  ctx.fillStyle = css.getPropertyValue('--food');
  state.food.forEach(([x, y]) => { ctx.beginPath(); ctx.arc((x + .5) * cell, (y + .5) * cell, cell * .32, 0, 7); ctx.fill(); });
  state.s.forEach((body, i) => {
    ctx.fillStyle = css.getPropertyValue(i === you ? '--me' : '--them');
    body.forEach(([x, y], k) => { ctx.globalAlpha = k === 0 ? 1 : .8; ctx.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2); });
    ctx.globalAlpha = 1;
  });
}

$('connect').onclick = async () => {
  provider = (window.phantom && window.phantom.solana) || window.solana;
  if (!provider || !provider.isPhantom) return status('Phantom not found. Install it from phantom.app.');
  try {
    const r = await provider.connect();
    wallet = r.publicKey.toString();
    $('connect').textContent = wallet.slice(0, 4) + '...' + wallet.slice(-4);
    $('play').disabled = false;
    status('Wallet connected. Pick a stake and play. Phantom must be on devnet.');
  } catch (e) { status('Connection cancelled.'); }
};

$('play').onclick = async () => {
  $('play').disabled = true;
  try {
    const { Connection, PublicKey, SystemProgram, Transaction } = solanaWeb3;
    const pk = new PublicKey(wallet);
    const conn = new Connection(cfg.rpc, 'confirmed');
    const tx = new Transaction().add(SystemProgram.transfer({ fromPubkey: pk, toPubkey: new PublicKey(cfg.escrow), lamports: Math.round(stake * 1e9) }));
    tx.feePayer = pk;
    const bh = await conn.getLatestBlockhash();
    tx.recentBlockhash = bh.blockhash;
    status('Approve the stake in Phantom...');
    const { signature } = await provider.signAndSendTransaction(tx);
    status('Confirming your stake on-chain...');
    await conn.confirmTransaction({ signature, ...bh }, 'confirmed');
    ws.send(JSON.stringify({ type: 'join', wallet, stake, sig: signature }));
    status('Verifying your stake...');
  } catch (e) { status('Stake failed: ' + (e.message || e)); $('play').disabled = false; }
};
$('leave').onclick = () => ws.send(JSON.stringify({ type: 'leave' }));

const keys = { ArrowUp:'up', w:'up', ArrowDown:'down', s:'down', ArrowLeft:'left', a:'left', ArrowRight:'right', d:'right' };
const dir = (d) => { if (playing) ws.send(JSON.stringify({ type: 'dir', dir: d })); };
addEventListener('keydown', (e) => { if (keys[e.key]) { e.preventDefault(); dir(keys[e.key]); } });
let t0;
cvs.addEventListener('touchstart', (e) => { t0 = e.touches[0]; });
cvs.addEventListener('touchend', (e) => {
  if (!t0) return;
  const dx = e.changedTouches[0].clientX - t0.clientX, dy = e.changedTouches[0].clientY - t0.clientY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  dir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});

connectWS();
</script>
</body>
</html>
